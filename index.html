<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/src/assets/images/RCJ-Logistics-Favicon.png" />
    <title>Taller de Mantenimiento</title>
    <script>
      // Aplica el tema antes de pintar la pagina, para que no haya parpadeo claro->oscuro al cargar.
      // Por defecto siempre claro (no se respeta el tema del sistema): solo pasa a oscuro si el usuario
      // lo eligio explicitamente con el boton del header.
      (function () {
        try {
          if (localStorage.getItem('rcj_theme_v1') === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
